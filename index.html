<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHILLY.VC</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            cursor: pointer;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="resources/riddlydiddly.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("bg-video");

        document.body.addEventListener("click", () => {
            video.muted = false;
            video.play();
        }, { once: true });
    </script>
</body>
</html>
